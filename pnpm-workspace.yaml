packages: [packages/*, examples/*, apps/*, demo]
allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@openrouter/sdk': false
  braintrust: false
  core-js-pure: false
  esbuild: false
  msgpackr-extract: true
  node-liblzma: false
  protobufjs: false
  # Required by Astro support in apps/www.
  sharp: true
  workerd: false
minimumReleaseAge: 1440
# The TanStack AI preview packages come from pkg.pr.new and load each other by
# URL, which this check blocks even when the URLs are pinned. The `overrides`
# below pin every one of them to a single full commit SHA. The lockfile has no
# integrity hash for these tarballs, so the SHA in the URL is the only pin.
# Remove this line when TanStack AI is on npm.
blockExoticSubdeps: false
resolutionMode: highest
minimumReleaseAgeExclude:
  # The internal registry gateway omits the "time" metadata field, so the
  # release-age gate cannot evaluate this scope and fails resolution instead.
  - '@cloudflare/*'
  # The Cloudflare toolchain releases in same-day lockstep (@cloudflare/vite-plugin
  # peers on the wrangler released with it, which pins workerd/miniflare exactly),
  # so the gate would tear paired versions apart; the toolchain cadence is the
  # effective gate.
  - wrangler
  - workerd
  - miniflare
  - '@ai-sdk/*'
  # Vendor SDKs of the provider adapters. Kept from the pi setup, where pi
  # pinned them exactly; the TanStack AI adapters pin only some of them.
  - '@anthropic-ai/sdk'
  - '@google/genai'
  - '@mistralai/mistralai'
  - openai
  - '@aws-sdk/*'
  - '@smithy/*'
  - ai
  - protobufjs
  - react
  - react-dom
# One copy of each TanStack AI preview package, from the same pkg.pr.new
# commit. Their peer ranges point at npm, so these overrides keep every
# workspace package on the preview build.
overrides:
  '@tanstack/ai': https://pkg.pr.new/TanStack/ai/@tanstack/ai@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-utils': https://pkg.pr.new/TanStack/ai/@tanstack/ai-utils@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-event-client': https://pkg.pr.new/TanStack/ai/@tanstack/ai-event-client@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-harness': https://pkg.pr.new/TanStack/ai/@tanstack/ai-harness@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-persistence': https://pkg.pr.new/TanStack/ai/@tanstack/ai-persistence@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-models': https://pkg.pr.new/TanStack/ai/@tanstack/ai-models@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-compaction': https://pkg.pr.new/TanStack/ai/@tanstack/ai-compaction@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-mcp': https://pkg.pr.new/TanStack/ai/@tanstack/ai-mcp@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-anthropic': https://pkg.pr.new/TanStack/ai/@tanstack/ai-anthropic@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-openai': https://pkg.pr.new/TanStack/ai/@tanstack/ai-openai@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/openai-base': https://pkg.pr.new/TanStack/ai/@tanstack/openai-base@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-gemini': https://pkg.pr.new/TanStack/ai/@tanstack/ai-gemini@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-bedrock': https://pkg.pr.new/TanStack/ai/@tanstack/ai-bedrock@7b549412f74dd3dff68039bb66b2a138ae6025b8
  '@tanstack/ai-mistral': https://pkg.pr.new/TanStack/ai/@tanstack/ai-mistral@7b549412f74dd3dff68039bb66b2a138ae6025b8
